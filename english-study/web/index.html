<title>Business English Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: a trading-desk notebook — one narrow reading column, tab bar on top, ledger-style tables for records. */
:root {
  --paper: #F3F6F5; --card: #FFFFFF; --ink: #13201C; --muted: #5A6A64; --line: #D9E1DE;
  --accent: #0E6B57; --accent-ink: #FFFFFF; --accent-soft: #E0EFEA;
  --review: #A65A16; --review-soft: #F6EADB;
  --good: #1D7A3E; --good-soft: #E3F3E8; --bad: #B3261E; --bad-soft: #FBE7E5;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1412; --card: #151D1A; --ink: #E4ECE9; --muted: #92A29C; --line: #27322E;
  --accent: #4DBF9E; --accent-ink: #08201A; --accent-soft: #15302A;
  --review: #E3A35F; --review-soft: #33261A;
  --good: #5BC983; --good-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1B19; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0E1412; --card: #151D1A; --ink: #E4ECE9; --muted: #92A29C; --line: #27322E;
  --accent: #4DBF9E; --accent-ink: #08201A; --accent-soft: #15302A;
  --review: #E3A35F; --review-soft: #33261A;
  --good: #5BC983; --good-soft: #15301F; --bad: #F08A80; --bad-soft: #3A1B19; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 8px 12px; }
.brand { display: flex; flex-direction: column; }
.brand b { font-family: var(--f-read); font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12.5px; }
.level-pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.level-pill .dots { display: inline-flex; gap: 3px; }
.level-pill .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.level-pill .dots i.on { background: var(--accent); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
nav.tabs button { flex: 1 0 auto; font: inherit; font-weight: 500; background: none; border: 0; color: var(--muted); padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .badge { font-family: var(--f-num); font-size: 11px; background: var(--review); color: var(--card); border-radius: 999px; padding: 0 6px; line-height: 18px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h2 { font-family: var(--f-read); font-weight: 600; font-size: 26px; line-height: 1.2; margin: 4px 0 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0 0 10px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daystrip button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
.daystrip button small { color: var(--muted); font-size: 11px; }
.daystrip button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.daystrip .tick { color: var(--good); }

.story { font-family: var(--f-read); font-size: 19px; line-height: 1.7; margin: 14px 0 0; max-width: 65ch; }
.story p { margin: 0 0 14px; }
.story strong { font-weight: 600; background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
.story strong.rv { background: linear-gradient(transparent 62%, var(--review-soft) 62%); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 8px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

.check { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.check.done { border-color: var(--good); background: var(--good-soft); }

.terms { display: grid; gap: 0; }
.term { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 12px 0; border-top: 1px solid var(--line); }
.term:first-child { border-top: 0; padding-top: 0; }
.term b { font-size: 15.5px; }
.term .ko { color: var(--ink); }
.term .ex { font-family: var(--f-read); font-style: italic; color: var(--muted); font-size: 15.5px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.tag.new { background: var(--accent-soft); color: var(--accent); }
.tag.rv { background: var(--review-soft); color: var(--review); }

.btn { font: inherit; font-weight: 600; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

.tlist { display: grid; gap: 8px; }
.titem { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); cursor: pointer; font: inherit; color: inherit; text-align: left; width: 100%; }
.titem[aria-pressed="true"] { border-color: var(--accent); }
.state { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.state.todo { background: var(--review-soft); color: var(--review); }
.state.ok { background: var(--good-soft); color: var(--good); }
.state.mid { background: var(--accent-soft); color: var(--accent); }
.state.low { background: var(--bad-soft); color: var(--bad); }

.q { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.q:first-of-type { border-top: 0; }
.q .qh { display: flex; gap: 10px; align-items: baseline; }
.q .qn { font-family: var(--f-num); color: var(--muted); font-size: 13px; min-width: 2.2em; }
.q .qt { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.q .prompt { font-family: var(--f-read); font-size: 17px; line-height: 1.55; min-width: 0; }
.q .hint { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em; }
.q input[type="text"], .q textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.q textarea { min-height: 76px; resize: vertical; font-family: var(--f-read); font-size: 16px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--paper); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.verdict { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.verdict.self { background: var(--accent-soft); color: var(--ink); }
.verdict .ans { color: var(--ink); font-weight: 600; }
.selfgrade { display: flex; gap: 8px; flex-wrap: wrap; }
.selfgrade button { font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.selfgrade button[aria-pressed="true"].y { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.selfgrade button[aria-pressed="true"].n { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.scorebar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.scorebar .big { font-family: var(--f-num); font-size: 34px; font-weight: 600; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.vrow:first-child { border-top: 0; }
.vrow .meta { font-size: 12.5px; color: var(--muted); grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; }
.boxes { display: inline-flex; gap: 3px; align-items: center; }
.boxes i { width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
.boxes i.on { background: var(--accent); }
.due { color: var(--review); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.stat .v { font-family: var(--f-num); font-size: 24px; font-weight: 600; }
.stat .l { font-size: 12.5px; color: var(--muted); }
.ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger th { text-align: left; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.ledger td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
.ledger td.num { text-align: right; }
.tablewrap { overflow-x: auto; }
.levels { display: grid; gap: 6px; }
.lv { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; }
.lv.cur { border-color: var(--accent); background: var(--accent-soft); }
.lv .n { font-family: var(--f-num); font-weight: 600; }
.notice { padding: 12px 14px; border-radius: var(--r); background: var(--review-soft); color: var(--ink); font-size: 14px; }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Business English Daily</b><span>경제·비즈니스 표현 · 간격 반복 학습</span></div>
    <div class="level-pill" id="levelPill" title="현재 학습 레벨"><span class="dots" id="levelDots"></span><span id="levelName">레벨 불러오는 중</span></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">오늘 학습</button>
    <button role="tab" data-tab="tests" aria-selected="false">테스트 <span class="badge" id="testBadge" hidden></span></button>
    <button role="tab" data-tab="vocab" aria-selected="false">단어장</button>
    <button role="tab" data-tab="record" aria-selected="false">기록·레벨</button>
  </nav>
  <main id="view"><div class="empty">학습 데이터를 불러오는 중입니다…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const LEVELS = [
    { n: 1, name: "Intermediate", ko: "핵심 비즈니스 표현", perDay: 3 },
    { n: 2, name: "Upper-Intermediate", ko: "자주 쓰는 관용 표현", perDay: 4 },
    { n: 3, name: "Advanced", ko: "경제 기사·협상 표현", perDay: 5 },
    { n: 4, name: "Advanced+", ko: "뉘앙스가 섬세한 관용구", perDay: 5 },
    { n: 5, name: "Expert", ko: "칼럼·애널리스트 문체", perDay: 6 },
  ];
  const INTERVALS = [1, 2, 4, 7, 15, 30];
  const UP = 85, DOWN = 60;
  const TYPE_LABEL = { fill: "빈칸", ko: "한→영", mc: "객관식", write: "작문" };

  const S = { days: {}, vocab: {}, tests: {}, meta: null, loaded: new Set(),
    tab: "today", day: null, test: null, vfilter: "due", db: null, saving: false,
    drafts: {}, phase: {}, self: {} };

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(new Date());
  const addDays = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const dow = (d) => "일월화수목금토"[new Date(d + "T00:00:00Z").getUTCDay()];
  const fmt = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)} (${dow(d)})`;
  const norm = (t) => String(t || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/[-‐–—]/g, " ").replace(/[^a-z0-9' ]+/g, " ").replace(/'/g, "").replace(/\s+/g, " ").trim();
  const level = () => LEVELS[(S.meta?.level || 3) - 1];

  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); }
  function loadDrafts() { try { S.drafts = JSON.parse(localStorage.getItem("bed-drafts") || "{}"); } catch { S.drafts = {}; } }
  function saveDrafts() { try { localStorage.setItem("bed-drafts", JSON.stringify(S.drafts)); } catch {} }

  // ---------- derived data
  const dayList = () => Object.values(S.days).sort((a, b) => a.date.localeCompare(b.date));
  const testList = () => Object.values(S.tests).sort((a, b) => b.date.localeCompare(a.date));
  const vocabList = () => Object.entries(S.vocab).map(([id, v]) => ({ id, ...v }));
  const dueCount = () => vocabList().filter((v) => v.next_review && v.next_review <= today()).length;
  const pendingTests = () => testList().filter((t) => !t.submitted);
  const pct = (t) => (t.total ? Math.round((t.score / t.total) * 100) : 0);

  function reviewMatcher(ids) {
    const keys = ids.map((id) => S.vocab[id]?.expression || id.replace(/-/g, " "))
      .map((e) => e.replace(/\(.*?\)/g, "").split(/[\s/]+/).filter((w) => !/^(a|an|the|one's|sth|sb|to|of|on|in|up|over)$/i.test(w)))
      .map((ws) => ws.sort((a, b) => b.length - a.length)[0]?.slice(0, 5).toLowerCase()).filter(Boolean);
    return (txt) => keys.some((k) => txt.toLowerCase().includes(k));
  }
  function storyHTML(day) {
    const isRv = reviewMatcher(day.reviewIds || []);
    return String(day.story || "").split(/\n\s*\n/).map((p) =>
      "<p>" + esc(p).replace(/\*\*(.+?)\*\*/g, (_, t) => {
        const rv = t.includes("🔁") || isRv(t);
        return `<strong class="${rv ? "rv" : ""}">${t.replace("🔁", "")}</strong>`;
      }) + "</p>").join("");
  }

  // ---------- rendering
  function render() {
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    const lv = level();
    $("#levelDots").innerHTML = LEVELS.map((l) => `<i class="${l.n <= lv.n ? "on" : ""}"></i>`).join("");
    $("#levelName").textContent = S.meta ? `Lv.${lv.n} ${lv.name}` : "레벨 준비 중";
    const pend = pendingTests().length;
    $("#testBadge").hidden = !pend; $("#testBadge").textContent = pend;
    if (!S.db) { $("#view").innerHTML = `<div class="card empty">이 화면에서는 학습 데이터에 연결할 수 없습니다. claude.ai에 로그인한 상태로 열어 주세요.</div>`; return; }
    if (S.loaded.size < 4) return;
    ({ today: renderToday, tests: renderTests, vocab: renderVocab, record: renderRecord })[S.tab]();
  }

  function renderToday() {
    const days = dayList();
    if (!days.length) { $("#view").innerHTML = `<div class="card empty">아직 스토리가 없습니다. 평일 오전 6시에 새 스토리가 올라옵니다.</div>`; return; }
    const t = today();
    if (!S.day || !S.days[S.day]) S.day = (days.filter((d) => d.date <= t).pop() || days[days.length - 1]).date;
    const d = S.days[S.day];
    const newV = (d.newIds || []).map((id) => ({ id, ...S.vocab[id] })).filter((v) => v.expression);
    const rvV = (d.reviewIds || []).map((id) => ({ id, ...S.vocab[id] })).filter((v) => v.expression);
    const test = S.tests[d.date];
    const isWeekend = [0, 6].includes(new Date(t + "T00:00:00Z").getUTCDay());
    $("#view").innerHTML = `
      <div class="stack">
        <div class="daystrip" role="group" aria-label="날짜 선택">${days.slice().reverse().map((x) => `
          <button data-day="${x.date}" aria-pressed="${x.date === S.day}">${fmt(x.date)}<small>${x.studied ? '<span class="tick">✓ 학습</span>' : "미학습"}</small></button>`).join("")}
        </div>
        ${isWeekend && !S.days[t] ? `<div class="notice">주말에는 새 스토리가 없습니다. 밤 9시 주말 복습 테스트로 한 주를 정리하세요.</div>` : ""}
        <article class="card">
          <div class="eyebrow">${fmt(d.date)} · Lv.${d.level || "–"} · 새 표현 ${newV.length}개 · 복습 ${rvV.length}개</div>
          <h2>${esc(d.title)}</h2>
          <div class="story">${storyHTML(d)}</div>
          <div class="legend"><span><i style="background:var(--accent-soft)"></i>새 표현</span><span><i style="background:var(--review-soft)"></i>복습 표현</span></div>
        </article>
        <label class="check ${d.studied ? "done" : ""}">
          <input type="checkbox" id="studied" ${d.studied ? "checked" : ""}>
          <span><b>${d.studied ? "학습 완료" : "스토리를 읽고 표현을 익혔어요"}</b><br><span class="muted">${d.studied && d.studiedAt ? `${esc(d.studiedAt.slice(0, 16).replace("T", " "))}에 체크` : "체크하면 기록 탭의 학습 달력에 남습니다."}</span></span>
        </label>
        <section class="card">
          <h3>새 표현</h3>
          <div class="terms">${newV.map((v) => `
            <div class="term"><b>${esc(v.expression)}<span class="tag new">NEW</span></b><span class="ko">${esc(v.meaning)}</span><span class="ex">${esc(v.example)}</span></div>`).join("") || '<p class="muted">새 표현이 없습니다.</p>'}
          </div>
        </section>
        ${rvV.length ? `<section class="card"><h3>복습 표현</h3><div class="terms">${rvV.map((v) => `
          <div class="term"><b>${esc(v.expression)}<span class="tag rv">복습</span></b><span class="ko">${esc(v.meaning)}</span>${v.example ? `<span class="ex">${esc(v.example)}</span>` : ""}</div>`).join("")}</div></section>` : ""}
        ${(d.bonus || []).length ? `<section class="card"><h3>보너스 어휘 <span class="muted" style="font-weight:400">· 테스트 제외</span></h3><div class="terms">${d.bonus.map((b) => `
          <div class="term"><b>${esc(b.term)} ${b.pos ? `<span class="muted" style="font-weight:400">(${esc(b.pos)})</span>` : ""}</b><span class="ko">${esc(b.meaning)}</span></div>`).join("")}</div></section>` : ""}
        <div class="row">${test ? `<button class="btn" data-goto-test="${d.date}">${test.submitted ? `이 날 테스트 결과 보기 (${pct(test)}%)` : "이 날 테스트 풀기"}</button>` : `<span class="muted">이 날의 테스트는 밤 9시에 올라옵니다.</span>`}</div>
      </div>`;
  }

  function stateTag(t) {
    if (!t.submitted) return `<span class="state todo">미응시</span>`;
    const p = pct(t); return `<span class="state ${p >= UP ? "ok" : p >= DOWN ? "mid" : "low"}">${t.score}/${t.total} · ${p}%</span>`;
  }

  function renderTests() {
    const list = testList();
    if (!list.length) { $("#view").innerHTML = `<div class="card empty">아직 테스트가 없습니다. 매일 밤 9시에 올라옵니다.</div>`; return; }
    if (!S.test || !S.tests[S.test]) S.test = (pendingTests().pop() || list[0]).date;
    const t = S.tests[S.test];
    $("#view").innerHTML = `
      <div class="stack">
        <div class="tlist">${list.map((x) => `
          <button class="titem" data-test="${x.date}" aria-pressed="${x.date === S.test}">
            <span><b>${fmt(x.date)}</b> <span class="muted">${x.kind === "weekend" ? "주말 복습" : "데일리"} · ${x.questions.length}문항</span></span>${stateTag(x)}
          </button>`).join("")}
        </div>
        <section class="card" id="testCard">${testBody(t)}</section>
      </div>`;
  }

  function autoGrade(q, resp) {
    if (q.type === "mc") return resp !== undefined && resp !== "" && +resp === q.correct;
    if (q.type === "write") return null;
    const r = norm(resp); return !!r && (q.answers || []).some((a) => norm(a) === r);
  }

  function testBody(t) {
    const done = t.submitted;
    const phase = done ? "done" : (S.phase[t.date] || "answer");
    const draft = S.drafts[t.date] || {};
    const self = S.self[t.date] || {};
    const resp = done ? (t.responses || {}) : draft;
    const writes = t.questions.filter((q) => q.type === "write");
    const allSelf = writes.every((q) => self[q.id] !== undefined);
    const answered = t.questions.filter((q) => String(resp[q.id] ?? "").trim() !== "").length;
    let header = `<div class="eyebrow">${fmt(t.date)} · ${t.kind === "weekend" ? "주말 복습 테스트" : "데일리 테스트"}</div>`;
    if (done) {
      const p = pct(t);
      header += `<div class="scorebar"><span class="big">${p}%</span><span>${t.score} / ${t.total} 정답</span><span class="muted">${esc((t.submittedAt || "").slice(0, 16).replace("T", " "))} 제출</span></div>
        ${t.levelNote ? `<div class="notice" style="margin-top:10px">${esc(t.levelNote)}</div>` : ""}`;
    } else if (phase === "grade") {
      header += `<p class="muted" style="margin:6px 0 0">자동 채점이 끝났습니다. 작문 문항은 모범 답안과 비교해 직접 맞음/틀림을 골라 주세요.</p>`;
    } else {
      header += `<p class="muted" style="margin:6px 0 0">빈칸·한→영은 표현을 직접 입력하고, 작문은 자유롭게 쓰세요. 대소문자·하이픈은 구분하지 않습니다.</p>`;
    }
    const qs = t.questions.map((q, i) => {
      const r = resp[q.id] ?? "";
      const graded = phase !== "answer";
      const res = done ? t.results?.[q.id] : (q.type === "write" ? self[q.id] : autoGrade(q, r));
      let input = "";
      if (q.type === "mc") {
        input = `<div class="opts" role="radiogroup">${q.options.map((o, k) => {
          const cls = graded ? (k === q.correct ? "right" : (String(r) === String(k) ? "wrong" : "")) : "";
          return `<label class="opt ${cls}"><input type="radio" name="${t.date}-${q.id}" value="${k}" data-q="${q.id}" ${String(r) === String(k) ? "checked" : ""} ${graded ? "disabled" : ""}><span>(${"abcd"[k]}) ${esc(o)}</span></label>`; }).join("")}</div>`;
      } else if (q.type === "write") {
        input = `<textarea id="in-${t.date}-${q.id}" data-q="${q.id}" placeholder="영어 문장으로 쓰세요" ${graded ? "readonly" : ""}>${esc(r)}</textarea>`;
      } else {
        input = `<input type="text" id="in-${t.date}-${q.id}" data-q="${q.id}" value="${esc(r)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="표현을 입력하세요" ${graded ? "readonly" : ""}>`;
      }
      let verdict = "";
      if (graded) {
        if (q.type === "write") {
          verdict = `<div class="verdict ${res === true ? "ok" : res === false ? "no" : "self"}">모범 답안: <span class="ans">${esc(q.model)}</span></div>`;
          if (!done) verdict += `<div class="selfgrade"><button class="y" data-self="${q.id}" data-v="1" aria-pressed="${self[q.id] === true}">맞게 썼어요</button><button class="n" data-self="${q.id}" data-v="0" aria-pressed="${self[q.id] === false}">다시 볼래요</button></div>`;
          else verdict += `<div class="verdict ${res ? "ok" : "no"}">${res ? "✓ 맞음 (자가 채점)" : "✗ 다시 복습"}</div>`;
        } else if (q.type === "mc") {
          verdict = `<div class="verdict ${res ? "ok" : "no"}">${res ? "✓ 정답" : `✗ 오답 · 정답 <span class="ans">(${"abcd"[q.correct]}) ${esc(q.options[q.correct])}</span>`}</div>`;
        } else {
          verdict = `<div class="verdict ${res ? "ok" : "no"}">${res ? "✓ 정답" : `✗ 오답 · 정답 <span class="ans">${esc(q.answers[0])}</span>`}${q.answers.length > 1 ? `<br><span class="muted">허용: ${q.answers.slice(1).map(esc).join(" / ")}</span>` : ""}</div>`;
        }
      }
      const vnames = (q.vocab || []).map((id) => S.vocab[id]?.expression).filter(Boolean).join(", ");
      return `<div class="q">
        <div class="qh"><span class="qn">${String(i + 1).padStart(2, "0")}</span><span class="qt">${TYPE_LABEL[q.type]}</span>${graded && vnames ? `<span class="muted" style="font-size:12.5px">${esc(vnames)}</span>` : ""}</div>
        <div class="prompt">${esc(q.prompt)}</div>
        ${q.hint && !graded ? `<div class="hint">힌트 ${esc(q.hint)}</div>` : ""}
        ${input}${verdict}</div>`;
    }).join("");
    let foot = "";
    if (!done && phase === "answer") foot = `<div class="row" style="margin-top:8px"><button class="btn" id="gradeBtn" ${answered ? "" : "disabled"}>채점하기</button><span class="muted">${answered}/${t.questions.length} 답함 · 빈 답은 오답 처리</span></div>`;
    if (!done && phase === "grade") foot = `<div class="row" style="margin-top:8px"><button class="btn" id="saveBtn" ${allSelf && !S.saving ? "" : "disabled"}>${S.saving ? "저장 중…" : "결과 저장"}</button><button class="btn ghost" id="backBtn">답 고치기</button>${allSelf ? "" : `<span class="muted">작문 ${writes.length}문항을 자가 채점해 주세요</span>`}</div>`;
    return header + qs + foot;
  }

  function renderVocab() {
    const t = today();
    const all = vocabList().sort((a, b) => (a.next_review || "").localeCompare(b.next_review || "") || a.expression.localeCompare(b.expression));
    const F = { due: (v) => v.next_review <= t, learning: (v) => (v.box || 0) < 4, mastered: (v) => (v.box || 0) >= 4, all: () => true };
    const list = all.filter(F[S.vfilter]);
    const cnt = (k) => all.filter(F[k]).length;
    $("#view").innerHTML = `
      <div class="stack">
        <div class="filters" role="group" aria-label="단어장 필터">
          ${[["due", "오늘 복습"], ["learning", "익히는 중"], ["mastered", "마스터"], ["all", "전체"]].map(([k, l]) => `<button data-vf="${k}" aria-pressed="${S.vfilter === k}">${l} <span class="num">${cnt(k)}</span></button>`).join("")}
        </div>
        <section class="card">${list.map((v) => {
          const tries = (v.correct || 0) + (v.wrong || 0);
          return `<div class="vrow">
            <div style="min-width:0"><b>${esc(v.expression)}</b> <span class="muted">— ${esc(v.meaning)}</span>${v.example ? `<div class="muted" style="font-family:var(--f-read);font-style:italic">${esc(v.example)}</div>` : ""}</div>
            <span class="boxes" title="암기 단계 ${v.box || 0}/5">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= (v.box || 0) ? "on" : ""}"></i>`).join("")}</span>
            <div class="meta"><span class="${v.next_review <= t ? "due" : ""}">다음 복습 ${v.next_review <= t ? "오늘" : fmt(v.next_review)}</span><span>정답률 <span class="num">${tries ? Math.round((v.correct / tries) * 100) + "%" : "–"}</span> (${tries}회)</span><span>${fmt(v.introduced)} 학습</span></div>
          </div>`; }).join("") || `<div class="empty">해당하는 표현이 없습니다.</div>`}</section>
        <p class="muted" style="font-size:13px">맞히면 다음 단계로 올라가 복습 간격이 1→2→4→7→15→30일로 늘어나고, 틀리면 1단계로 돌아갑니다. 4단계 이상이면 마스터로 봅니다.</p>
      </div>`;
  }

  function renderRecord() {
    const days = dayList().slice().reverse();
    const subs = testList().filter((t) => t.submitted);
    const totQ = subs.reduce((s, t) => s + t.total, 0), totC = subs.reduce((s, t) => s + t.score, 0);
    let streak = 0; for (const d of dayList().slice().reverse()) { if (d.studied) streak++; else break; }
    const recent = subs.slice(0, 3);
    const recentAvg = recent.length ? Math.round(recent.reduce((s, t) => s + pct(t), 0) / recent.length) : null;
    const lv = level(), m = S.meta || {};
    const mastered = vocabList().filter((v) => (v.box || 0) >= 4).length;
    $("#view").innerHTML = `
      <div class="stack">
        <div class="stats">
          <div class="stat"><div class="v">${dayList().filter((d) => d.studied).length}<span class="muted" style="font-size:14px">/${dayList().length}</span></div><div class="l">학습 완료한 날</div></div>
          <div class="stat"><div class="v">${streak}</div><div class="l">연속 학습일</div></div>
          <div class="stat"><div class="v">${totQ ? Math.round((totC / totQ) * 100) + "%" : "–"}</div><div class="l">전체 정답률 (${subs.length}회)</div></div>
          <div class="stat"><div class="v">${mastered}<span class="muted" style="font-size:14px">/${vocabList().length}</span></div><div class="l">마스터한 표현</div></div>
        </div>
        <section class="card">
          <h3>학습 레벨</h3>
          <div class="levels">${LEVELS.map((l) => `<div class="lv ${l.n === lv.n ? "cur" : ""}"><span class="n">Lv.${l.n}</span><span><b>${l.name}</b> <span class="muted">· ${l.ko}</span></span><span class="muted num">새 표현 ${l.perDay}개/일</span></div>`).join("")}</div>
          <p class="muted" style="font-size:13.5px;margin:12px 0 0">테스트를 2회 이상 본 뒤 최근 3회 평균이 <b>${UP}% 이상</b>이면 한 단계 올리고, <b>${DOWN}% 미만</b>이면 한 단계 내립니다. 아침 스토리는 현재 레벨에 맞춰 표현 수와 난이도를 정합니다.
          ${recentAvg !== null ? `<br>최근 ${recent.length}회 평균 <b class="num">${recentAvg}%</b> · 레벨 변경 후 ${m.testsSinceChange || 0}회 응시` : "<br>아직 제출한 테스트가 없습니다."}</p>
          ${(m.levelHistory || []).length ? `<div class="tablewrap" style="margin-top:12px"><table class="ledger"><thead><tr><th>날짜</th><th>변경</th><th>사유</th></tr></thead><tbody>${m.levelHistory.slice().reverse().map((h) => `<tr><td class="num">${esc(h.date)}</td><td>${h.from ? `Lv.${h.from} → ` : ""}Lv.${h.to}</td><td>${esc(h.reason)}</td></tr>`).join("")}</tbody></table></div>` : ""}
        </section>
        <section class="card">
          <h3>날짜별 기록</h3>
          <div class="tablewrap"><table class="ledger"><thead><tr><th>날짜</th><th>스토리</th><th>학습</th><th style="text-align:right">테스트</th></tr></thead><tbody>
          ${days.map((d) => { const t = S.tests[d.date]; return `<tr><td class="num">${fmt(d.date)}</td><td>${esc(d.title)}</td><td>${d.studied ? '<span style="color:var(--good)">✓</span>' : '<span class="muted">–</span>'}</td><td class="num">${t ? (t.submitted ? `${pct(t)}%` : '<span class="muted">미응시</span>') : "–"}</td></tr>`; }).join("")}
          ${testList().filter((t) => !S.days[t.date]).map((t) => `<tr><td class="num">${fmt(t.date)}</td><td class="muted">주말 복습</td><td>–</td><td class="num">${t.submitted ? pct(t) + "%" : '<span class="muted">미응시</span>'}</td></tr>`).join("")}
          </tbody></table></div>
        </section>
      </div>`;
  }

  // ---------- actions
  async function toggleStudied(checked) {
    const d = S.days[S.day];
    try { await S.db.doc("days/" + d.date).update({ studied: checked, studiedAt: checked ? new Date().toISOString() : null }); toast(checked ? "학습 완료로 기록했어요" : "학습 완료를 취소했어요"); }
    catch (e) { toast("저장하지 못했어요. 잠시 후 다시 시도해 주세요."); render(); }
  }

  async function saveTest(date) {
    const t = S.tests[date]; const draft = S.drafts[date] || {}; const self = S.self[date] || {};
    S.saving = true; render();
    const results = {}; let score = 0;
    t.questions.forEach((q) => { const ok = q.type === "write" ? !!self[q.id] : autoGrade(q, draft[q.id]); results[q.id] = ok; if (ok) score++; });
    const total = t.questions.length, p = Math.round((score / total) * 100), now = today();
    // per-vocab outcome: correct only if every question on it was right
    const outcome = {};
    t.questions.forEach((q) => (q.vocab || []).forEach((id) => { outcome[id] = (outcome[id] ?? true) && results[q.id]; }));
    // level evaluation
    const m = S.meta || { level: 3, testsSinceChange: 0, levelHistory: [] };
    const since = (m.testsSinceChange || 0) + 1;
    const prev = testList().filter((x) => x.submitted && x.date !== date).map(pct);
    const win = [p, ...prev].slice(0, Math.min(3, since));
    const avg = Math.round(win.reduce((s, x) => s + x, 0) / win.length);
    let newLevel = m.level || 3, note = "", hist = (m.levelHistory || []).slice();
    if (since >= 2 && avg >= UP && newLevel < 5) { newLevel++; note = `최근 ${win.length}회 평균 ${avg}% → Lv.${newLevel} ${LEVELS[newLevel - 1].name}로 올라갑니다. 내일 스토리부터 적용돼요.`; }
    else if (since >= 2 && avg < DOWN && newLevel > 1) { newLevel--; note = `최근 ${win.length}회 평균 ${avg}% → Lv.${newLevel} ${LEVELS[newLevel - 1].name}로 조정합니다. 복습 비중을 늘릴게요.`; }
    if (newLevel !== m.level) hist.push({ date: now, from: m.level, to: newLevel, reason: `최근 ${win.length}회 평균 ${avg}%` });
    try {
      await S.db.doc("tests/" + date).update({ submitted: true, responses: draft, results, score, total, submittedAt: new Date().toISOString(), levelNote: note || null });
      for (const [id, ok] of Object.entries(outcome)) {
        const v = S.vocab[id]; if (!v) continue;
        const box = ok ? Math.min(5, (v.box || 0) + 1) : 0;
        await S.db.doc("vocab/" + id).update({ box, next_review: addDays(now, INTERVALS[box]), last_tested: now, correct: (v.correct || 0) + (ok ? 1 : 0), wrong: (v.wrong || 0) + (ok ? 0 : 1) });
      }
      await S.db.doc("meta/state").set({ ...m, level: newLevel, testsSinceChange: newLevel !== m.level ? 0 : since, levelHistory: hist, lastScore: p, updatedAt: new Date().toISOString() });
      delete S.drafts[date]; delete S.phase[date]; delete S.self[date]; saveDrafts();
      toast(`저장했어요 · ${score}/${total} (${p}%)`);
    } catch (e) { toast("결과를 저장하지 못했어요. 다시 시도해 주세요."); }
    S.saving = false; render();
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("button"); if (!el) return;
    if (el.dataset.tab) { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); }
    else if (el.dataset.day) { S.day = el.dataset.day; render(); }
    else if (el.dataset.test) { S.test = el.dataset.test; render(); }
    else if (el.dataset.gotoTest) { S.test = el.dataset.gotoTest; S.tab = "tests"; render(); window.scrollTo(0, 0); }
    else if (el.dataset.vf) { S.vfilter = el.dataset.vf; render(); }
    else if (el.dataset.self) { (S.self[S.test] ||= {})[el.dataset.self] = el.dataset.v === "1"; $("#testCard").innerHTML = testBody(S.tests[S.test]); }
    else if (el.id === "gradeBtn") { S.phase[S.test] = "grade"; $("#testCard").innerHTML = testBody(S.tests[S.test]); $("#testCard").scrollIntoView({ block: "start" }); }
    else if (el.id === "backBtn") { S.phase[S.test] = "answer"; $("#testCard").innerHTML = testBody(S.tests[S.test]); }
    else if (el.id === "saveBtn") saveTest(S.test);
  });
  document.addEventListener("input", (e) => {
    const q = e.target.dataset?.q; if (!q || !S.test) return;
    (S.drafts[S.test] ||= {})[q] = e.target.value; saveDrafts();
    const btn = $("#gradeBtn"); if (btn) btn.disabled = false;
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "studied") toggleStudied(e.target.checked);
    else if (e.target.type === "radio" && e.target.dataset.q) { (S.drafts[S.test] ||= {})[e.target.dataset.q] = e.target.value; saveDrafts(); const btn = $("#gradeBtn"); if (btn) btn.disabled = false; }
  });

  // ---------- data
  async function start() {
    loadDrafts();
    const db = window.claude?.use ? await window.claude.use("db") : null;
    S.db = db;
    if (!db) { render(); return; }
    const sub = (name, coll) => db.collection(coll).onSnapshot((snap) => {
      const o = {}; snap.docs.forEach((d) => { o[d.id] = d.data(); }); S[name] = o; S.loaded.add(name); renderSafe();
    }, () => { S.loaded.add(name); renderSafe(); });
    sub("days", "days"); sub("vocab", "vocab"); sub("tests", "tests");
    db.doc("meta/state").onSnapshot((d) => { S.meta = d.exists ? d.data() : null; S.loaded.add("meta"); renderSafe(); }, () => { S.loaded.add("meta"); renderSafe(); });
  }
  // keep typed answers and focus intact while live updates arrive
  function renderSafe() {
    const a = document.activeElement;
    if (S.tab === "tests" && a && a.dataset?.q && !S.saving) { renderHeaderOnly(); return; }
    render();
  }
  function renderHeaderOnly() {
    const lv = level();
    $("#levelDots").innerHTML = LEVELS.map((l) => `<i class="${l.n <= lv.n ? "on" : ""}"></i>`).join("");
    $("#levelName").textContent = S.meta ? `Lv.${lv.n} ${lv.name}` : "레벨 준비 중";
  }
  render();
  start();
})();
</script>
